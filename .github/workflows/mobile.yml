name: mobile
on:
  push:
    branches: [main, feat/mobile-app]
    paths: ['mobile/**', '.github/workflows/mobile.yml']
  workflow_dispatch:
    inputs:
      ios:
        description: 'Also build the iOS app (uses macOS minutes, 10x cost)'
        type: boolean
        default: false

jobs:
  android:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile } }
    env:
      API_BASE_URL: http://103.228.38.69:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "3.47.9", channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      # Release signing. Without the four secrets the build still works but is signed with the
      # debug key: fine as a check, NOT installable as an update over the real app.
      - name: Write release signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          STORE_PW: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/release.jks
            printf 'storeFile=release.jks\nstorePassword=%s\nkeyPassword=%s\nkeyAlias=%s\n' "$STORE_PW" "$KEY_PW" "$KEY_ALIAS" > android/key.properties
            echo "SIGNED=true" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing secrets set - APK will not be release-signed"
          fi
      - run: flutter build apk --release --target-platform android-arm,android-arm64 --dart-define=API_BASE_URL=${{ env.API_BASE_URL }}
      - name: Show signature
        run: $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)/apksigner verify --print-certs build/app/outputs/flutter-apk/app-release.apk | head -5
      - uses: actions/upload-artifact@v4
        with:
          name: cheapbazar-android-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  ios:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.ios }}
    runs-on: macos-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "3.47.9", channel: stable }
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign --dart-define=API_BASE_URL=http://103.228.38.69:3000
      - uses: actions/upload-artifact@v4
        with: { name: cheapbazar-ios-unsigned, path: mobile/build/ios/iphoneos/Runner.app }
